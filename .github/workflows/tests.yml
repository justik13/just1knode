name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: >-
            .git
            docs
          shellcheck_options: -e SC1091,SC2034,SC2317,SC2155

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile Python files
        run: python -m compileall -q lib scripts tests
      - name: Run xray-api microservice tests
        run: |
          python -m pip install -r scripts/xray_api/requirements.txt -r scripts/xray_api/requirements-dev.txt
          (cd scripts/xray_api && pytest -v)
      - name: Run amnezia-api microservice tests
        run: |
          python -m pip install -r scripts/amnezia_api/requirements.txt -r scripts/amnezia_api/requirements-dev.txt
          (cd scripts/amnezia_api && pytest -v)

  test-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install requirements for test suite
        run: |
          python -m pip install -r scripts/xray_api/requirements.txt -r scripts/amnezia_api/requirements.txt
      - name: Run just1knode shell script test suite
        run: |
          python -m unittest tests/test_just1knode_sh.py -v
